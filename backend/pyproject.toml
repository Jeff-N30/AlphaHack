[project]
name = "visaref"
version = "0.1.0"
description = "AI visa application audit officer"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlmodel",
  "python-multipart",
  "httpx",
  "tenacity",
  "pymupdf",
  "pdfplumber",
  "pillow",
  "pytesseract",
  "passporteye",
  "mrz",
  "rapidfuzz",
  "python-dateutil",
  "pyyaml",
  "cryptography",
  "apscheduler",
  "reportlab",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs local services (e.g. Ollama)",
]
